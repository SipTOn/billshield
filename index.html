            var protoDesc = Object.getOwnPropertyDescriptor(Window.prototype, 'fetch');
            if (protoDesc && !protoDesc.set) {
              Object.defineProperty(Window.prototype, 'fetch', {
                get: protoDesc.get,
                set: function(val) {
                  try {
                    Object.defineProperty(this, 'fetch', {
                      value: val,
                      writable: true,
                      configurable: true,
                      enumerable: true
                    });
                  } catch (err) {
                    this._customFetch = val;
                  }
                },
                configurable: true
              });
            }
          }
        } catch (e) {}
      })();
